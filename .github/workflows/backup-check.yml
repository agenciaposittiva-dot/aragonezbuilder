# Teste periódico de restauração do backup (docs/BACKUP.md).
# Faz o dump do banco de produção, restaura num Postgres descartável do próprio
# runner e confere linhas e arquivos. Sem o segredo BACKUP_CHECK_DATABASE_URL
# o job só avisa e termina: nada roda contra banco nenhum.
name: Teste de restauração do backup

on:
  schedule:
    - cron: "17 6 * * 1" # segundas, 03:17 em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restore
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # Conexão direta (sem pooler) com o usuário dono das tabelas, só leitura na prática.
      DATABASE_OWNER_URL: ${{ secrets.BACKUP_CHECK_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.BACKUP_CHECK_DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BACKUP_CHECK_AUTH_SECRET || 'backup-check-only-not-used-for-sessions' }}
      STORAGE_DRIVER: ${{ vars.STORAGE_DRIVER || 'database' }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_REGION: ${{ vars.S3_REGION }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
    steps:
      - name: Rotina desativada
        if: env.DATABASE_OWNER_URL == ''
        run: echo "::notice::Defina o segredo BACKUP_CHECK_DATABASE_URL para ativar o teste de restauração."
      - uses: actions/checkout@v4
        if: env.DATABASE_OWNER_URL != ''
      - uses: actions/setup-node@v4
        if: env.DATABASE_OWNER_URL != ''
        with:
          node-version: 22
          cache: npm
      - name: Cliente Postgres 17
        if: env.DATABASE_OWNER_URL != ''
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - if: env.DATABASE_OWNER_URL != ''
        run: npm ci --ignore-scripts
      - name: Dump, restauração e conferência
        if: env.DATABASE_OWNER_URL != ''
        run: >-
          npx tsx --tsconfig tsconfig.node.json scripts/backup-check.ts --env /dev/null
          --target-server postgres://postgres:restore@localhost:5432/postgres
          --target-db producao_restore_check --sample 50
